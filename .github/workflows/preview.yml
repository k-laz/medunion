# Preview of the site on GitHub Pages, for showing it to people before
# launch: https://k-laz.github.io/medunion/ and the Kansk site at
# https://k-laz.github.io/medunion/kansk/
# Rebuilt on every push to main. It is a preview build: search engines
# are told not to index it, and Metrica/Bitrix24 are off.
#
# One-time setup in GitHub: Settings > Pages > Source: "GitHub Actions".
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every night at 03:00 Krasnoyarsk time (20:00 UTC): banners start and end on
  # their dates, and the years on the home page stay right.
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build both sites
        env:
          MAIN_ORIGIN: https://k-laz.github.io/medunion
          KANSK_ORIGIN: https://k-laz.github.io/medunion/kansk
        run: |
          npm run build
          npm run build:kansk
      - name: Move the sites under /medunion/ and /medunion/kansk/
        run: |
          node scripts/rebase.mjs dist /medunion
          node scripts/rebase.mjs dist-kansk /medunion/kansk
          mv dist-kansk dist/kansk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
