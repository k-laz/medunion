# The booking API (deploy/api/server.mjs). Included inside `location /api/`.
proxy_pass http://127.0.0.1:8787;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_read_timeout 60s;
client_max_body_size 32k;
# (the program itself sends Cache-Control: no-store; no add_header here, so
# the server's security headers still apply)
