# nginx config for kansk.medunion.group on the new server (the Kansk site:
# city pages only). Copy to /etc/nginx/sites-available/kansk.medunion.group and
# link it into sites-enabled, on the Kansk switch day (see deploy/SERVER.md).
# Files: /var/www/medunion/kansk, redirects: /var/www/medunion/redirects-kansk.conf
# (both uploaded by the GitHub deploy).

server {
    listen 80;
    listen [::]:80;
    server_name kansk.medunion.group;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://kansk.medunion.group$request_uri; }
    server_tokens off;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kansk.medunion.group;

    ssl_certificate     /etc/letsencrypt/live/kansk.medunion.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kansk.medunion.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    root  /var/www/medunion/kansk;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # Old Kansk addresses -> new pages, here or on medunion.group (made by the build)
    include /var/www/medunion/redirects-kansk.conf;

    location = /index.php { return 301 /$is_args$args; }
    location ^~ /bitrix/  { return 301 /$is_args$args; }

    # Online booking: the same program as the main site (deploy/api/)
    location /api/ { include /etc/nginx/medunion-api.conf; }
    # The content editor lives on the GitHub Pages preview, not here
    location ^~ /admin/ { return 404; }

    # Anything this site does not have (articles, news, patient information,
    # reviews, Krasnoyarsk-only services) lives on the main site at the same address.
    location / {
        try_files $uri $uri/ @main;
    }
    location @main {
        return 301 https://medunion.group$request_uri;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Caching with `expires`, not add_header: an add_header here would drop the
    # server's security headers below for these files
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }
    location /upload/ {
        expires 30d;
        try_files $uri @main;
    }
    location ~* \.(svg|woff2?|png|jpe?g|webp|ico)$ {
        expires 30d;
        try_files $uri @main;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Same rules as medunion.group (see its config for what each one does)
    add_header Content-Security-Policy "frame-ancestors 'self' https://webvisor.com https://*.webvisor.com https://metrika.yandex.ru https://metrica.yandex.com https://metrika.yandex.by https://metrika.yandex.kz https://metrica.yandex.com.tr; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=86400" always;
}
