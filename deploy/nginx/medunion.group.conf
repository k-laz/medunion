# nginx config for medunion.group on the new server.
# Copy to /etc/nginx/sites-available/medunion.group and link it into
# sites-enabled (see deploy/SERVER.md). The site files live in
# /var/www/medunion/site, the redirect list in /var/www/medunion/redirects.conf
# (both uploaded by the GitHub deploy).

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name medunion.group www.medunion.group;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://medunion.group$request_uri; }
}

# www -> without www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.medunion.group;

    ssl_certificate     /etc/letsencrypt/live/medunion.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medunion.group/privkey.pem;

    return 301 https://medunion.group$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medunion.group;

    ssl_certificate     /etc/letsencrypt/live/medunion.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medunion.group/privkey.pem;

    root  /var/www/medunion/site;
    index index.html;
    charset utf-8;

    # Redirects use paths only, without the domain
    absolute_redirect off;

    # Old Bitrix addresses -> new pages (generated by `npm run convert`)
    include /var/www/medunion/redirects.conf;

    # Old Bitrix entry points
    location = /index.php { return 301 /; }
    location ^~ /bitrix/  { return 301 /; }

    location / {
        # /uslugi -> /uslugi/ happens automatically (directory with index.html)
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Files with a content hash in their name never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /upload/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location ~* \.(svg|woff2?|png|jpe?g|webp|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
