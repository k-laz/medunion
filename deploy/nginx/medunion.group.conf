# nginx config for medunion.group on the new server.
# Copy to /etc/nginx/sites-available/medunion.group and link it into
# sites-enabled (see deploy/SERVER.md). The site files live in
# /var/www/medunion/site, the redirect list in /var/www/medunion/redirects.conf
# (both uploaded by the GitHub deploy).
#
# Security headers are set once per server below. A location must not use
# add_header itself (nginx would then drop the server's headers there), so
# caching is set with `expires` instead.

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name medunion.group www.medunion.group;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://medunion.group$request_uri; }
    server_tokens off;
}

# www -> without www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.medunion.group;

    ssl_certificate     /etc/letsencrypt/live/medunion.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medunion.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://medunion.group$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medunion.group;

    ssl_certificate     /etc/letsencrypt/live/medunion.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medunion.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    root  /var/www/medunion/site;
    index index.html;
    charset utf-8;

    # Redirects use paths only, without the domain
    absolute_redirect off;

    # Old Bitrix addresses -> new pages (generated by `npm run convert`)
    include /var/www/medunion/redirects.conf;

    # Old Bitrix entry points
    location = /index.php { return 301 /$is_args$args; }
    location ^~ /bitrix/  { return 301 /$is_args$args; }

    # Online booking: our small server next to the site (deploy/api/)
    location /api/ { include /etc/nginx/medunion-api.conf; }

    location / {
        # /uslugi -> /uslugi/ happens automatically (directory with index.html)
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Files with a content hash in their name never change
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }
    location /upload/ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(svg|woff2?|png|jpe?g|webp|ico)$ {
        expires 30d;
        try_files $uri =404;
    }
    # The content editor lives on the GitHub Pages preview, not here (see deploy.yml)
    location ^~ /admin/ { return 404; }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Pages can't be framed by other sites (except Metrica's Webvisor, which
    # replays visits in a frame), no plugins, no <base> tricks, forms only post
    # here. Scripts are not restricted: Metrica, Bitrix24 and Daily Grow load
    # code from many addresses. No X-Frame-Options: it can't allow Webvisor.
    add_header Content-Security-Policy "frame-ancestors 'self' https://webvisor.com https://*.webvisor.com https://metrika.yandex.ru https://metrica.yandex.com https://metrika.yandex.by https://metrika.yandex.kz https://metrica.yandex.com.tr; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    # Browsers remember to use https only. One day while the switch settles;
    # raise to 31536000 (a year) a month after it.
    add_header Strict-Transport-Security "max-age=86400" always;
}
