# Catch-all: requests by bare IP address or for any name this server doesn't
# host get the connection closed, so the site and /api/ are only reachable
# as https://medunion.group. Replaces the test site once the real config is on:
#   sudo cp deploy/nginx/default.conf /etc/nginx/sites-available/default-drop
#   sudo ln -sf /etc/nginx/sites-available/default-drop /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/medunion-test
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    # any certificate will do: the connection is closed right after
    ssl_certificate     /etc/letsencrypt/live/medunion.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medunion.group/privkey.pem;
    server_tokens off;
    return 444;
}
